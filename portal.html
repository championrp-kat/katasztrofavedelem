.top{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.96);backdrop-filter:blur(8px);border-bottom:3px solid var(--red)}
.topin{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topin .crest{width:34px}
.logo{font:700 24px/1 var(--head);letter-spacing:2px;text-transform:uppercase}
.logo small{display:block;font:500 11px var(--body);letter-spacing:.6px;color:var(--muted);margin-top:3px;text-transform:uppercase}
.sp{flex:1}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.25}
.who b{display:block;color:var(--text);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border:2px solid transparent;border-radius:999px;background:var(--red);color:#fff;font:700 16px var(--head);letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.btn:hover{background:var(--red2)}
.btn.o{background:transparent;border-color:#4a5262}.btn.o:hover{background:#fff;color:#000}
.btn.g{background:var(--green)}.btn.g:hover{background:#237a49}
.btn.s{min-height:34px;padding:0 14px;font-size:14px}
.btn.big{min-height:58px;font-size:22px;width:100%}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;background:var(--ink3);font:600 14px var(--head);letter-spacing:.8px;text-transform:uppercase;color:#c8cfda;white-space:nowrap}
.tab.cur{background:var(--red);color:#fff}
main{max-width:1100px;margin:0 auto;padding:6px 16px 60px}
h1{font:700 clamp(30px,6vw,44px)/1 var(--head);letter-spacing:1px;text-transform:uppercase;margin:18px 0 4px}
h1:before{content:"";display:block;width:54px;height:4px;background:var(--red);margin-bottom:12px}
h2{font:700 22px/1.1 var(--head);letter-spacing:1px;text-transform:uppercase;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lab{font:600 12px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.bigt{font:700 clamp(40px,11vw,64px)/1 var(--head);letter-spacing:2px;margin:6px 0 14px}
.stat{font:700 36px/1 var(--head);color:var(--red);margin-top:6px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row .m{color:var(--muted);font-size:13px}
.row b{font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--ink3);font:600 12px var(--head);letter-spacing:.7px;text-transform:uppercase;color:#d5dae3;margin:2px 4px 2px 0}
.pill.v{background:var(--red);color:#fff}.pill.ok{background:var(--green);color:#fff}.pill.no{background:#7a1f26;color:#fff}.pill.w{background:#6b5314;color:#ffe7a8}
label{display:block;font:600 12px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #333b49;background:#0d1016;font-size:16px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto;margin-right:8px;vertical-align:middle}
.chk{display:flex;align-items:center;font:500 15px var(--body);letter-spacing:0;text-transform:none;color:var(--text);margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.empty{color:var(--muted);padding:12px 0}
.av{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:hsl(var(--h) 45% 32%);font:700 16px var(--head);letter-spacing:1px;flex:none}
.pr{display:flex;gap:12px;align-items:center}
.login{max-width:420px;margin:8vh auto 0;padding:0 16px}
.login .card{padding:26px}
.login .crest{width:84px;display:block;margin:0 auto 14px}
.login h1{text-align:center}.login h1:before{margin:0 auto 12px}
.err{background:#3a1015;border:1px solid #7a1f26;color:#ffc9cd;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.demo{background:#3b2e0b;color:#ffe7a8;text-align:center;font-size:13px;padding:6px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:50;max-width:90vw;text-align:center}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.trophy{font-size:34px}
.bar{height:6px;border-radius:3px;background:var(--ink3);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--red)}
.nj{padding:40px 20px;text-align:center}
.card,.row>div{min-width:0}
input,select,textarea{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.row b,.row .m{overflow-wrap:anywhere}
@media(max-width:560px){.who{display:none}.logo small{display:none}.topin{gap:10px}}

<body>
<noscript><div class="nj">A portál használatához JavaScript szükséges.</div></noscript>
<div id="app"></div>
<script>
(function(){
'use strict';
var CFG=window.FIREBASE_CONFIG,DEMO=!(CFG&&CFG.apiKey&&CFG.projectId);
var RANKS=['KOK akadémista','Őrmester','Törzsőrmester','Főtörzsőrmester','Zászlós','Törzszászlós','Főtörzszászlós','Hadnagy','Főhadnagy','Százados','Őrnagy','Alezredes','Ezredes'];
var GROUPS=[['Főtisztek',['Őrnagy','Alezredes','Ezredes']],['Tisztek',['Hadnagy','Főhadnagy','Százados']],['Zászlósok',['Zászlós','Törzszászlós','Főtörzszászlós']],['Tiszthelyettesek',['Őrmester','Törzsőrmester','Főtörzsőrmester']],['KOK akadémisták',['KOK akadémista']]];
var EXAMS=['PÁV vizsga','Őrmesteri vizsga','Különleges szerkezelői vizsga'];
var TABS=[['szolgalat','Szolgálat'],['allomany','Állomány'],['vizsgak','Vizsgák'],['oktatas','Oktatási napló'],['hr','HR'],['infok','Infók'],['hetdolgozoja','A hét dolgozója'],['tagok','Tagok kezelése','admin']];

/* ---------- segédek ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(u){return String(u||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9._-]+/g,'.').replace(/^\.+|\.+$/g,'')}
function p2(n){return n<10?'0'+n:''+n}
function fdt(ms){var d=new Date(ms);return d.getFullYear()+'. '+p2(d.getMonth()+1)+'. '+p2(d.getDate())+'. '+p2(d.getHours())+':'+p2(d.getMinutes())}
function fd(ms){var d=new Date(ms);return d.getFullYear()+'. '+p2(d.getMonth()+1)+'. '+p2(d.getDate())+'.'}
function dur(ms){ms=Math.max(0,ms);var m=Math.floor(ms/60000);return Math.floor(m/60)+' ó '+p2(m%60)+' p'}
function clock(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60)}
function weekStart(){var d=new Date();d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.getTime()}
function rk(r){return r==='KOK akadémista'||!r?(r||''):'tű. '+r.toLowerCase()}
function ini(n){var p=String(n||'?').replace(/^Dr\.\s*/,'').split(/\s+/);return((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase()}
function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2800)}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function rnd(n){var c='abcdefghjkmnpqrstuvwxyz23456789',s='';for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function emailOf(u){return norm(u)+'@katved.rp'}
function errMsg(e){var c=(e&&e.code)||'';var m={'auth/invalid-credential':'Hibás felhasználónév vagy jelszó.','auth/wrong-password':'Hibás felhasználónév vagy jelszó.','auth/user-not-found':'Hibás felhasználónév vagy jelszó.','auth/invalid-email':'Érvénytelen felhasználónév.','auth/weak-password':'A jelszó legalább 6 karakter legyen.','auth/email-already-in-use':'Ez a felhasználónév már foglalt.','auth/too-many-requests':'Túl sok próbálkozás, várj egy kicsit.','auth/network-request-failed':'Nincs hálózat.','permission-denied':'Nincs jogosultságod ehhez.'};return m[c]||(e&&e.message)||'Hiba történt.'}

/* ---------- adatréteg: demó (böngészőben) ---------- */
var Demo=(function(){
 var DB=null,uid=null,KEY='katved_demo_v1';
 function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
 function seed(){var n=Date.now();return{acc:{u1:{username:'admin',pw:'admin123'},u2:{username:'kovacs.peter',pw:'demo123'},u3:{username:'szabo.anna',pw:'demo123'}},
  users:[{id:'u1',username:'admin',name:'Péter Előd',rank:'Ezredes',role:'vezeto',titles:'Vezetői állomány',mentor:'',joined:'2026-01-10',active:true,oktato:true,vizsgabiztos:true},
  {id:'u2',username:'kovacs.peter',name:'Kovács Péter',rank:'Hadnagy',role:'tag',titles:'Tűzoltási vezető, Medic',mentor:'Péter Előd',joined:'2026-03-02',active:true,oktato:false,vizsgabiztos:false},
  {id:'u3',username:'szabo.anna',name:'Szabó Anna',rank:'KOK akadémista',role:'tag',titles:'',mentor:'Kovács Péter',joined:'2026-10-20',active:true,oktato:false,vizsgabiztos:false}],
  shifts:[{id:'s1',uid:'u2',name:'Kovács Péter',start:n-86400000*2,end:n-86400000*2+5400000},{id:'s2',uid:'u2',name:'Kovács Péter',start:n-3*3600000,end:null}],
  exams:[],teaching:[],leave:[],info:[{id:'i1',title:'Üdvözlünk a KATVÉD portálon',text:'Ez a demó mód: az adatok csak ezen az eszközön vannak. Az élesítéshez kövesd az útmutatót.',date:n,author:'Péter Előd'}],weekly:[],config:{init:{ok:true}}}}
 function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}if(!DB){DB=seed();save()}}
 function C(c){return DB[c]}
 return{
  init:function(){load();try{uid=sessionStorage.getItem('katved_uid')||null}catch(e){}return Promise.resolve()},
  me:function(){return uid},
  hasInit:function(){return Promise.resolve(true)},
  signIn:function(u,p){var k=norm(u);for(var id in DB.acc){if(DB.acc[id].username===k&&DB.acc[id].pw===p){uid=id;try{sessionStorage.setItem('katved_uid',id)}catch(e){}return Promise.resolve(id)}}return Promise.reject({code:'auth/invalid-credential'})},
  signOut:function(){uid=null;try{sessionStorage.removeItem('katved_uid')}catch(e){}return Promise.resolve()},
  list:function(c,w){var a=C(c).slice();if(w)a=a.filter(function(x){return x[w[0]]===w[1]});return Promise.resolve(a)},
  get:function(c,id){var r=C(c).filter(function(x){return x.id===id})[0];return Promise.resolve(r||null)},
  add:function(c,d){d=JSON.parse(JSON.stringify(d));d.id='d'+Date.now()+Math.floor(Math.random()*1000);C(c).push(d);save();return Promise.resolve(d.id)},
  set:function(c,id,d){d=JSON.parse(JSON.stringify(d));d.id=id;var a=C(c),i=a.findIndex(function(x){return x.id===id});if(i<0)a.push(d);else a[i]=d;save();return Promise.resolve()},
  update:function(c,id,p){var a=C(c),i=a.findIndex(function(x){return x.id===id});if(i>=0)for(var k in p)a[i][k]=p[k];save();return Promise.resolve()},
  del:function(c,id){DB[c]=C(c).filter(function(x){return x.id!==id});save();return Promise.resolve()},
  createAccount:function(u,p){var k=norm(u);for(var id in DB.acc)if(DB.acc[id].username===k)return Promise.reject({code:'auth/email-already-in-use'});var n='u'+Date.now();DB.acc[n]={username:k,pw:p};save();return Promise.resolve(n)},
  setupFirst:function(){return Promise.reject({message:'Demó módban nincs első beállítás.'})},
  changePassword:function(o,n){if(DB.acc[uid].pw!==o)return Promise.reject({code:'auth/invalid-credential'});DB.acc[uid].pw=n;save();return Promise.resolve()},
  onAuth:function(cb){cb(uid)}
 }
})();

/* ---------- adatréteg: Firebase ---------- */
var FB=(function(){
 var A,Au,F,app,auth,fs,cbs=[];
 var base='https://www.gstatic.com/firebasejs/10.12.2/';
 function strip(d){var o={};for(var k in d)if(d[k]!==undefined)o[k]=d[k];return o}
 return{
  init:function(){return Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]).then(function(m){A=m[0];Au=m[1];F=m[2];app=A.initializeApp(CFG);auth=Au.getAuth(app);fs=F.getFirestore(app);
   return new Promise(function(res){var first=true;Au.onAuthStateChanged(auth,function(u){if(first){first=false;res()}})})})},
  me:function(){return auth.currentUser?auth.currentUser.uid:null},
  hasInit:function(){return F.getDoc(F.doc(fs,'config','init')).then(function(s){return s.exists()}).catch(function(){return true})},
  signIn:function(u,p){return Au.signInWithEmailAndPassword(auth,emailOf(u),p).then(function(c){return c.user.uid})},
  signOut:function(){return Au.signOut(auth)},
  list:function(c,w){var q=F.collection(fs,c);if(w)q=F.query(q,F.where(w[0],'==',w[1]));return F.getDocs(q).then(function(s){return s.docs.map(function(d){var o=d.data();o.id=d.id;return o})})},
  get:function(c,id){return F.getDoc(F.doc(fs,c,id)).then(function(s){if(!s.exists())return null;var o=s.data();o.id=s.id;return o})},
  add:function(c,d){return F.addDoc(F.collection(fs,c),strip(d)).then(function(r){return r.id})},
  set:function(c,id,d){return F.setDoc(F.doc(fs,c,id),strip(d))},
  update:function(c,id,p){return F.updateDoc(F.doc(fs,c,id),strip(p))},
  del:function(c,id){return F.deleteDoc(F.doc(fs,c,id))},
  createAccount:function(u,p){var sec=A.initializeApp(CFG,'sec'+Date.now());var a2=Au.getAuth(sec);
   return Au.createUserWithEmailAndPassword(a2,emailOf(u),p).then(function(c){var id=c.user.uid;return Au.signOut(a2).then(function(){return id})}).catch(function(e){throw e})},
  setupFirst:function(u,p,prof,code){return Au.createUserWithEmailAndPassword(auth,emailOf(u),p).then(function(c){var id=c.user.uid;var b=F.writeBatch(fs);
    var d=strip(prof);d.setupCode=code;b.set(F.doc(fs,'users',id),d);b.set(F.doc(fs,'config','init'),{setupCode:code,at:Date.now()});
    return b.commit().then(function(){return id},function(e){return c.user.delete().then(function(){throw e},function(){throw e})})})},
  changePassword:function(o,n){var u=auth.currentUser;return Au.reauthenticateWithCredential(u,Au.EmailAuthProvider.credential(u.email,o)).then(function(){return Au.updatePassword(u,n)})}
 }
})();
var DB=DEMO?Demo:FB;

/* ---------- állapot ---------- */
var me=null,tab='szolgalat',timer=null,cache={};
function isAdmin(){return me&&me.role==='vezeto'}
function isExam(){return me&&(me.role==='vezeto'||me.vizsgabiztos)}
function isTeach(){return me&&(me.role==='vezeto'||me.oktato)}
function pills(t){return String(t||'').split(/,|·/).map(function(x){x=x.trim();return x?'<span class="pill'+(/vezetői állomány/i.test(x)?' v':'')+'">'+esc(x)+'</span>':''}).join('')}
function statusPill(s){return '<span class="pill '+(s==='Sikeres'||s==='Elfogadva'?'ok':s==='Sikertelen'||s==='Elutasítva'?'no':'w')+'">'+esc(s)+'</span>'}
function app(){return $('app')}

/* ---------- belépés ---------- */
function showLogin(msg,setup){
 DB.hasInit().then(function(ok){
  var h='<div class="login"><div class="card"><span class="crest"></span><h1>KATVÉD</h1><p class="sub" style="text-align:center">Katasztrófavédelem belső portál · csak az állomány tagjainak</p>';
  if(msg)h+='<div class="err">'+esc(msg)+'</div>';
  if(setup&&!ok){
   h+='<form data-form="setup"><h2>Első beállítás</h2><label>Teljes neved</label><input name="name" required><label>Rendfokozatod</label><select name="rank">'+RANKS.map(function(r){return '<option>'+r+'</option>'}).join('')+'</select><label>Beosztás (nem kötelező)</label><input name="titles"><label>Felhasználónév</label><input name="u" required autocapitalize="none" autocomplete="username"><label>Jelszó (min. 6 karakter)</label><input name="p" type="password" required minlength="6" autocomplete="new-password"><label>Beállítási kód</label><input name="code" required autocapitalize="none"><p class="note">Ezzel jön létre az első admin fiók (admin jog: tagokat kezel, jelentkezéseket bírál). A rendfokozatod ettől független, később a Tagok kezelése fülön átírhatod.</p><button class="btn big" style="margin-top:14px">Fiók létrehozása</button></form><p class="note" style="text-align:center"><a href="#" data-act="tologin" style="text-decoration:underline">Vissza a belépéshez</a></p>';
  }else{
   h+='<form data-form="login"><label>Felhasználónév</label><input name="u" required autocapitalize="none" autocomplete="username"><label>Jelszó</label><input name="p" type="password" required autocomplete="current-password"><button class="btn big" style="margin-top:16px">Belépés</button></form>';
   if(!ok)h+='<p class="note" style="text-align:center"><a href="#" data-act="tosetup" style="text-decoration:underline">Első beállítás (csak egyszer)</a></p>';
   if(DEMO)h+='<p class="note">Demó mód. Próbáld: <b>admin</b> / <b>admin123</b> (vezető) vagy <b>kovacs.peter</b> / <b>demo123</b> (tag).</p>';
  }
  h+='<p class="note" style="text-align:center"><a href="index.html" style="text-decoration:underline">← Vissza a nyilvános oldalra</a></p></div></div>';
  app().innerHTML=(DEMO?'<div class="demo">DEMÓ MÓD: az adatok csak ezen az eszközön vannak, még nincs élő adatbázis.</div>':'')+h;
 });
}
function loadMe(uid){
 return DB.get('users',uid).then(function(u){
  if(!u||!u.active){return DB.signOut().then(function(){me=null;showLogin(u?'A fiókod inaktív. Kérdezd a vezetőket.':'Ehhez a fiókhoz nincs tagi adatlap. Kérdezd a vezetőket.')})}
  me=u;cache={};go();
 }).catch(function(e){me=null;showLogin(errMsg(e))});
}

/* ---------- keret ---------- */
function frame(){
 var t=TABS.filter(function(x){return !x[2]||isAdmin()}).map(function(x){return '<a class="tab'+(x[0]===tab?' cur':'')+'" href="#'+x[0]+'">'+x[1]+'</a>'}).join('');
 app().innerHTML=(DEMO?'<div class="demo">DEMÓ MÓD: az adatok csak ezen az eszközön vannak, még nincs élő adatbázis.</div>':'')+
 '<div class="top"><div class="topin"><span class="crest"></span><div class="logo">KATVÉD<small>Katasztrófavédelem · Champion Város</small></div><span class="sp"></span><div class="who"><b>'+esc(me.name)+'</b>'+esc(rk(me.rank))+'</div><button class="btn o s" data-act="logout">Kilépés</button></div><nav class="tabs">'+t+'</nav></div><main id="view"></main>';
}
function go(){
 var h=(location.hash||'').replace('#','');
 if(!TABS.some(function(x){return x[0]===h&&(!x[2]||isAdmin())}))h='szolgalat';
 tab=h;frame();
 if(timer){clearInterval(timer);timer=null}
 var v=$('view');v.innerHTML='<p class="empty">Betöltés…</p>';
 (VIEWS[tab]||VIEWS.szolgalat)(v).catch(function(e){v.innerHTML='<div class="err">'+esc(errMsg(e))+'</div>'});
 window.scrollTo(0,0);
}
function reload(){if(timer){clearInterval(timer);timer=null}var y=window.scrollY;var v=$('view');(VIEWS[tab])(v).then(function(){window.scrollTo(0,y)}).catch(function(e){v.innerHTML='<div class="err">'+esc(errMsg(e))+'</div>'})}
function head(t,s){return '<h1>'+t+'</h1><p class="sub">'+s+'</p>'}

/* ---------- nézetek ---------- */
var VIEWS={};
VIEWS.szolgalat=function(v){
 if(timer){clearInterval(timer);timer=null}
 return Promise.all([DB.list('shifts'),DB.list('users')]).then(function(r){
  var all=r[0],mine=all.filter(function(s){return s.uid===me.id}).sort(function(a,b){return b.start-a.start});
  var act=mine.filter(function(s){return s.end==null})[0],now=Date.now(),ws=weekStart(),wk=0,tot=0;
  mine.forEach(function(s){var e=s.end==null?now:s.end;tot+=e-s.start;wk+=Math.max(0,e-Math.max(s.start,ws))});
  var on=all.filter(function(s){return s.end==null}).sort(function(a,b){return a.start-b.start});
  var h=head('Szolgálat','Üdv, '+esc(me.name)+'!');
  h+='<div class="grid"><div class="card"><div class="lab">'+(act?'Szolgálatban':'Nincs szolgálatban')+'</div><div class="bigt" id="clk">'+(act?clock(now-act.start):'00:00:00')+'</div>'+
   (act?'<button class="btn big" data-act="shiftend" data-id="'+act.id+'">Szolgálat leadása</button>':'<button class="btn big g" data-act="shiftstart">Szolgálat felvétele</button>')+'</div>'+
   '<div class="card"><div class="lab">Ezen a héten</div><div class="stat">'+dur(wk)+'</div><div class="lab" style="margin-top:20px">Összesen</div><div class="stat">'+dur(tot)+'</div></div></div>';
  h+='<div class="card"><h2>Szolgálatban most ('+on.length+')</h2>'+(on.length?on.map(function(s){return '<div class="row"><div><b>'+esc(s.name)+'</b><div class="m">Kezdés: '+fdt(s.start)+'</div></div>'+(isAdmin()&&s.uid!==me.id?'<button class="btn o s" data-act="shiftend" data-id="'+s.id+'">Lezárás</button>':'<span class="m">'+dur(now-s.start)+'</span>')+'</div>'}).join(''):'<div class="empty">Senki nincs szolgálatban.</div>')+'</div>';
  h+='<div class="card"><h2>Legutóbbi szolgálataim</h2>'+(mine.length?mine.slice(0,15).map(function(s){return '<div class="row"><span>'+fdt(s.start)+' → '+(s.end?fdt(s.end).slice(-5):'folyamatban')+'</span><b>'+(s.end?dur(s.end-s.start):'…')+'</b></div>'}).join(''):'<div class="empty">Még nincs szolgálatod.</div>')+'</div>';
  v.innerHTML=h;
  if(timer){clearInterval(timer);timer=null}
  if(act)timer=setInterval(function(){var c=$('clk');if(c)c.textContent=clock(Date.now()-act.start)},1000);
 });
};
VIEWS.allomany=function(v){
 return DB.list('users').then(function(us){
  us=us.filter(function(u){return u.active});
  var h=head('Állomány','Az állomány rendfokozat szerint · '+us.length+' fő')+'<input id="q" placeholder="Keresés névre, rendfokozatra, beosztásra…" style="margin-bottom:16px">';
  GROUPS.forEach(function(g){
   var m=us.filter(function(u){return g[1].indexOf(u.rank)>=0}).sort(function(a,b){return g[1].indexOf(b.rank)-g[1].indexOf(a.rank)||a.name.localeCompare(b.name,'hu')});
   if(!m.length)return;

/* ---------- események ---------- */
document.addEventListener('click',function(ev){
 var t=ev.target.closest('[data-act]');if(!t)return;
 var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),v=t.getAttribute('data-v');
 if(a==='tosetup'||a==='tologin'){ev.preventDefault();showLogin('',a==='tosetup');return}
 if(a==='logout'){DB.signOut().then(function(){me=null;showLogin('')});return}
 var done=function(m){return function(){if(m)toast(m);reload()}},fail=function(e){toast(errMsg(e))};
 if(a==='shiftstart'){DB.list('shifts',['uid',me.id]).then(function(l){if(l.some(function(s){return s.end==null}))return;return DB.add('shifts',{uid:me.id,name:me.name,start:Date.now(),end:null})}).then(done('Szolgálat felvéve')).catch(fail)}
 else if(a==='shiftend'){DB.update('shifts',id,{end:Date.now()}).then(done('Szolgálat leadva')).catch(fail)}
 else if(a==='exdel'){DB.del('exams',id).then(done('Visszavonva')).catch(fail)}
 else if(a==='exset'){DB.update('exams',id,{status:v,by:me.name}).then(done('Mentve')).catch(fail)}
 else if(a==='tdel'){if(confirm('Biztosan törlöd?'))DB.del('teaching',id).then(done('Törölve')).catch(fail)}
 else if(a==='ldel'){DB.del('leave',id).then(done('Visszavonva')).catch(fail)}
 else if(a==='lset'){DB.update('leave',id,{status:v}).then(done('Mentve')).catch(fail)}
 else if(a==='idel'){if(confirm('Biztosan törlöd?'))DB.del('info',id).then(done('Törölve')).catch(fail)}
 else if(a==='wdel'){if(confirm('Biztosan törlöd?'))DB.del('weekly',id).then(done('Törölve')).catch(fail)}
 else if(a==='medit'){var box=$('ed-'+id);if(box.innerHTML){box.innerHTML=''}else{var u=cache.users.filter(function(x){return x.id===id})[0];box.innerHTML=editForm(u)}}
});
document.addEventListener('submit',function(ev){
 var f=ev.target.closest('[data-form]');if(!f)return;ev.preventDefault();
 var k=f.getAttribute('data-form'),fd_=new FormData(f),g=function(n){return String(fd_.get(n)||'').trim()},btn=f.querySelector('button');
 var fail=function(e){if(btn)btn.disabled=false;toast(errMsg(e))},ok=function(m){return function(){toast(m);reload()}};
 if(btn)btn.disabled=true;
 if(k==='login'){DB.signIn(g('u'),fd_.get('p')).then(loadMe).catch(function(e){btn.disabled=false;showLogin(errMsg(e))});return}
 if(k==='setup'){DB.setupFirst(g('u'),fd_.get('p'),{username:norm(g('u')),name:g('name'),rank:g('rank'),role:'vezeto',titles:g('titles'),mentor:'',joined:today(),active:true,oktato:false,vizsgabiztos:false},g('code')).then(loadMe).catch(function(e){showLogin(errMsg(e),true)});return}
 if(k==='exam'){DB.add('exams',{uid:me.id,name:me.name,type:g('type'),note:g('note'),status:'Függőben',created:Date.now()}).then(ok('Jelentkezés elküldve')).catch(fail)}
 else if(k==='teach'){DB.add('teaching',{uid:me.id,by:me.name,title:g('title'),date:new Date(g('d')+'T12:00:00').getTime(),who:g('who'),abs:parseInt(g('abs'),10)||0,note:g('note')}).then(ok('Oktatás naplózva')).catch(fail)}
 else if(k==='leave'){if(g('to')<g('from')){fail({message:'A vége nem lehet a kezdete előtt.'});return}DB.add('leave',{uid:me.id,name:me.name,from:g('from'),to:g('to'),why:g('why'),status:'Függőben',created:Date.now()}).then(ok('Kérelem beküldve')).catch(fail)}
 else if(k==='pw'){DB.changePassword(fd_.get('o'),fd_.get('n')).then(function(){f.reset();if(btn)btn.disabled=false;toast('Jelszó módosítva')}).catch(fail)}
 else if(k==='info'){DB.add('info',{title:g('title'),text:g('text'),date:Date.now(),author:me.name}).then(ok('Közzétéve')).catch(fail)}
 else if(k==='weekly'){DB.add('weekly',{name:g('name'),why:g('why'),date:Date.now()}).then(ok('Közzétéve')).catch(fail)}
 else if(k==='newmember'){
  var prof={username:norm(g('u')),name:g('name'),rank:g('rank'),role:fd_.get('vezeto')?'vezeto':'tag',titles:g('titles'),mentor:g('mentor'),joined:g('joined'),active:true,oktato:!!fd_.get('oktato'),vizsgabiztos:!!fd_.get('vizsgabiztos')};
  if(!prof.username){fail({message:'Érvénytelen felhasználónév.'});return}
  DB.createAccount(g('u'),fd_.get('p')).then(function(id){return DB.set('users',id,prof)}).then(function(){toast('Tag létrehozva. Jelszó: '+fd_.get('p'));go()}).catch(fail)}
 else if(k==='medit'){var id=f.getAttribute('data-id');DB.update('users',id,{name:g('name'),rank:g('rank'),titles:g('titles'),mentor:g('mentor'),joined:g('joined'),role:fd_.get('vezeto')?'vezeto':'tag',oktato:!!fd_.get('oktato'),vizsgabiztos:!!fd_.get('vizsgabiztos'),active:!!fd_.get('active')}).then(ok('Mentve')).catch(fail)}
});
window.addEventListener('hashchange',function(){if(me)go()});

/* ---------- indulás ---------- */
app().innerHTML='<p class="empty" style="padding:40px;text-align:center">Betöltés…</p>';
DB.init().then(function(){var u=DB.me();if(u)loadMe(u);else showLogin('',false)}).catch(function(e){app().innerHTML='<div class="login"><div class="card"><div class="err">Nem sikerült csatlakozni az adatbázishoz: '+esc(errMsg(e))+'</div></div></div>'});
window.__portal={DB:DB,demo:DEMO};
})();
